<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MediLink — Hospital Records &amp; Intelligent Referral System</title>
<style>
:root{
  --bg:#0d1420; --bg2:#111b2b; --card:#152238; --card2:#1a2a44;
--line:#243553; --txt:#e8eefc; --mut:#93a4c4;
  --brand:#19c3a3; --brand2:#2f7bff; --warn:#ff9f43; --dang:#ff5468; --high:#ff7fa8;
  --ok:#28d07f; --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#17304d 0%,transparent 60%),var(--bg);
 color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,#101a2b,#0c1422);border-right:1px solid var(--line);
 padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 16px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));
 display:grid;place-items:center;font-size:20px}
.brand b{font-size:16px;letter-spacing:.3px}
.brand small{display:block;color:var(--mut);font-size:11px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mut);
 text-decoration:none;font-size:14px;margin-bottom:2px;transition:.18s;cursor:pointer}
.nav a:hover{background:#18273f;color:var(--txt);transform:translateX(3px)}
.nav a.on{background:linear-gradient(90deg,rgba(25,195,163,.22),rgba(47,123,255,.12));color:#fff;
 box-shadow:inset 3px 0 0 var(--brand)}
.nav .grp{font-size:10px;letter-spacing:1.4px;color:#5d7096;padding:14px 12px 6px;text-transform:uppercase}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:14px;align-items:center;padding:12px 20px;background:rgba(14,22,36,.86);
 backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border-radius:12px;border:1px solid var(--line);
 background:#0f1a2b;color:var(--txt);outline:none}
.search input:focus{border-color:var(--brand)}
.search span{position:absolute;left:11px;top:9px;opacity:.6}
.tbtn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#101c2e;
 display:grid;place-items:center;cursor:pointer}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--dang)}
.who{display:flex;gap:9px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:12px;background:#101c2e}
.who .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;font-size:12px;font-weight:700}
.emg{padding:8px 12px;border-radius:11px;background:rgba(255,84,104,.14);border:1px solid rgba(255,84,104,.5);
 color:#ffb3bd;font-size:12px;font-weight:600;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,84,104,.07)}}
.wrap{padding:22px;max-width:1400px;width:100%}
h1.page{font-size:24px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
/* Cards */
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);
 border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat{position:relative;overflow:hidden;transition:.2s}
.stat:hover{transform:translateY(-4px);border-color:rgba(25,195,163,.5)}
.stat .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:#0f1c2e;margin-bottom:10px}
.stat .v{font-size:30px;font-weight:700;line-height:1}
.stat .l{color:var(--mut);font-size:12px;margin-top:6px}
.h{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
/* Controls */
.btn{padding:9px 14px;border-radius:10px;border:1px solid transparent;font-size:13px;font-weight:600;cursor:pointer;
 background:linear-gradient(135deg,var(--brand),#12a58a);color:#04241d;transition:.18s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.o{background:transparent;border-color:var(--line);color:var(--txt)}
.btn.b{background:linear-gradient(135deg,var(--brand2),#1b5fd6);color:#fff}
.btn.r{background:linear-gradient(135deg,var(--dang),#d63a4c);color:#fff}
.btn.s{padding:6px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0f1a2b;color:var(--txt);font-family:inherit;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label{font-size:11px;color:var(--mut);display:block;margin:0 0 5px;letter-spacing:.4px;text-transform:uppercase}
.field{margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
tr:hover td{background:rgba(255,255,255,.03)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.t-low{background:rgba(40,208,127,.16);color:#6ff0b4}
.t-med{background:rgba(255,159,67,.16);color:#ffc689}
.t-high{background:rgba(255,127,168,.16);color:#ffb4cd}
.t-crit{background:rgba(255,84,104,.2);color:#ff98a5}
.t-info{background:rgba(47,123,255,.16);color:#9ec1ff}
.t-ok{background:rgba(25,195,163,.16);color:#7fead6}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#101c2e;color:var(--mut);cursor:pointer;font-size:13px}
.tabs button.on{background:linear-gradient(135deg,var(--brand),#12a58a);color:#04241d;border-color:transparent;font-weight:700}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--brand),var(--brand2))}
.tl .it{position:relative;margin-bottom:14px}
.tl .it:before{content:"";position:absolute;left:-23px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(25,195,163,.18)}
.tl .d{font-size:11px;color:var(--mut)}
.bar{height:9px;border-radius:9px;background:#0f1a2b;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.alert{border-radius:12px;padding:14px;margin:12px 0;border:1px solid}
.a-red{background:rgba(255,84,104,.12);border-color:rgba(255,84,104,.55)}
.a-org{background:rgba(255,159,67,.1);border-color:rgba(255,159,67,.5)}
.a-grn{background:rgba(40,208,127,.1);border-color:rgba(40,208,127,.45)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#101c2e;cursor:pointer;font-size:13px;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:linear-gradient(135deg,var(--brand),#12a58a);color:#04241d;font-weight:700;border-color:transparent}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.07);font-size:13px}
.kv span{color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(4,8,16,.7);display:none;place-items:center;z-index:99;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px;box-shadow:var(--sh)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--card2);border:1px solid var(--brand);padding:13px 18px;border-radius:12px;z-index:200;box-shadow:var(--sh);transform:translateY(120%);transition:.3s}
.toast.on{transform:none}
.mini{font-size:11px;color:var(--mut)}
.hide{display:none}
.burger{display:none}
@media(max-width:900px){
 .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s}
 .side.open{transform:none}
 .burger{display:grid}
 .wrap{padding:14px}
}

/* Language, voice & video additions */
.langbar{display:flex;gap:6px;align-items:center}
.lbtn{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#101c2e;color:var(--txt);cursor:pointer;font-size:13px;font-weight:600}
.lbtn.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#04121f;border-color:transparent}
.lbtn.stop{background:var(--dang);color:#fff;border-color:transparent}
.voicebar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:150;display:none;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--brand);padding:10px 14px;border-radius:999px;box-shadow:var(--sh)}
.voicebar.on{display:flex}
.voicebar .pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
.goog-te-banner-frame,.skiptranslate iframe,#goog-gt-tt{display:none!important}
body{top:0!important}
#gtwrap{display:none}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vbox{background:#070c15;border:1px solid var(--line);border-radius:16px;aspect-ratio:16/10;overflow:hidden;position:relative;display:grid;place-items:center;color:var(--mut)}
.vbox video{width:100%;height:100%;object-fit:cover}
.vbox .lbl{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:999px;font-size:12px;color:#fff}
.vctl{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.vctl button{width:58px;height:58px;border-radius:50%;border:0;font-size:22px;cursor:pointer;background:var(--card2);color:var(--txt)}
.vctl button.end{background:var(--dang)}
.vctl button.off{background:#3a2330}
.jitsi{width:100%;height:560px;border:0;border-radius:16px;background:#000}
@media(max-width:900px){.vgrid{grid-template-columns:1fr}.langbar .lt{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">🏥</div>
      <div><b>MediLink</b><small>Records &amp; Referral System</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="top">
      <div class="tbtn burger" onclick="document.getElementById('side').classList.toggle('open')">☰</div>
      <div class="search">
        <span>🔍</span>
        <input id="gsearch" placeholder="Search patient ID, name, phone, doctor, department…" oninput="globalSearch(this.value)" />
      </div>
      <div class="langbar" title="Language / భాష">
        <button class="lbtn on" id="lang-en" onclick="setLang('en')">English</button>
        <button class="lbtn" id="lang-te" onclick="setLang('te')">తెలుగు</button>
        <button class="lbtn" onclick="readPage()" title="Read this page aloud">🔊 <span class="lt">Listen</span></button>
        <button class="lbtn stop" onclick="stopVoice()" title="Stop voice">⏹ <span class="lt">Stop</span></button>
      </div>
      <div class="emg" id="emgInd">🚨 Emergency: <b id="emgCount">0</b></div>
      <div class="mini" id="today"></div>
      <div class="tbtn" onclick="showNotifs()">🔔<i class="dot"></i></div>
      <div class="who"><div class="av">HS</div><div><div style="font-size:12px;font-weight:600">Staff Console</div><div class="mini">Front Desk · Admin</div></div></div>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div class="voicebar notranslate" id="voicebar"><i class="pulse"></i><span id="vtxt">Speaking…</span><button class="lbtn stop" onclick="stopVoice()">⏹ Stop / ఆపు</button></div>
<div id="gtwrap"><div id="google_translate_element"></div></div>

<script>
/* ============================================================
   MediLink — single-file hospital records & referral prototype
   Storage: localStorage (key: medilink_v1)
   ============================================================ */
const KEY='medilink_v1';
const DEPTS=[
 {id:'D1',name:'General Medicine',icon:'🩺',desc:'First point of contact, undifferentiated symptoms'},

const DOCTORS=[

 {id:'DR02',name:'Dr. Priya Nair',dept:'Orthopedics',exp:6,slots:['02:00 PM','05:30 PM']},

 {id:'DR04',name:'Dr. Sneha Iyer',dept:'Cardiology',exp:7,slots:['11:00 AM','03:30 PM']},
 {id:'DR05',name:'Dr. Vikram Sen',dept:'Neurology',exp:11,slots:['10:00 AM','04:30 PM']},
 {id:'DR06',name:'Dr. Meera Joshi',dept:'General Medicine',exp:9,slots:['09:30 AM','12:30 PM']},
 {id:'DR07',name:'Dr. Arjun Das',dept:'General Medicine',exp:4,slots:['02:30 PM','06:00 PM']},
 {id:'DR08',name:'Dr. Kavya Reddy',dept:'Pediatrics',exp:10,slots:['10:15 AM','03:00 PM']},
 {id:'DR09',name:'Dr. Imran Shaikh',dept:'Dermatology',exp:5,slots:['11:30 AM','05:00 PM']},
 {id:'DR10',name:'Dr. Leela Menon',dept:'ENT',exp:12,slots:['09:45 AM','02:45 PM']},
 {id:'DR11',name:'Dr. Sarita Bose',dept:'Gynecology',exp:13,slots:['10:45 AM','04:15 PM']}
];
const today=()=>new Date().toISOString().slice(0,10);
const dAgo=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const uid=p=>p+Math.random().toString(36).slice(2,7).toUpperCase();

let DB=load();
function load(){
  const raw=localStorage.getItem(KEY);
  if(raw){try{return JSON.parse(raw)}catch(e){}}
  const db=seed(); localStorage.setItem(KEY,JSON.stringify(db)); return db;
}
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
function reset(){if(confirm('Reset all demo data?')){localStorage.removeItem(KEY);DB=load();go(location.hash||'#dashboard');toast('Demo data reset')}}

function seed(){
 const P=[
  {pid:'PT1001',name:'Ravi Sharma',age:54,gender:'Male',phone:'9876543210',email:'ravi@mail.com',address:'12 MG Road, Hyderabad',blood:'B+',ec:'9876500000',allergies:'Penicillin',conditions:'Hypertension, Type 2 Diabetes',symptoms:'Chest tightness while walking',admissions:'2 (2024, 2025)',surgeries:'Appendectomy 2019',meds:'Metformin, Amlodipine',pref:'Cardiology',created:dAgo(40)},
  {pid:'PT1002',name:'Anita Verma',age:32,gender:'Female',phone:'9812345678',email:'anita@mail.com',address:'7 Lake View, Pune',blood:'O+',ec:'9812300000',allergies:'None',conditions:'Migraine',symptoms:'Numbness in left arm, tingling',admissions:'0',surgeries:'None',meds:'Sumatriptan',pref:'Neurology',created:dAgo(25)},
  {pid:'PT1003',name:'Imran Qureshi',age:41,gender:'Male',phone:'9900112233',email:'imran@mail.com',address:'45 Park Street, Kolkata',blood:'A-',ec:'9900100000',allergies:'Dust',conditions:'Old knee injury',symptoms:'Right knee pain with swelling',admissions:'1 (2023)',surgeries:'ACL repair 2023',meds:'Ibuprofen as needed',pref:'Orthopedics',created:dAgo(12)},
  {pid:'PT1004',name:'Sunita Patil',age:27,gender:'Female',phone:'9765432109',email:'sunita@mail.com',address:'9 Green Villa, Nagpur',blood:'AB+',ec:'9765400000',allergies:'Sulfa drugs',conditions:'Eczema',symptoms:'Itchy rash on forearms',admissions:'0',surgeries:'None',meds:'Topical steroid',pref:'Dermatology',created:dAgo(6)},
  {pid:'PT1005',name:'Master Aarav Gupta',age:7,gender:'Male',phone:'9345678901',email:'gupta@mail.com',address:'21 Rose Lane, Delhi',blood:'B-',ec:'9345600000',allergies:'Peanuts',conditions:'Asthma',symptoms:'Recurrent fever and cough',admissions:'3 (2024-2026)',surgeries:'None',meds:'Salbutamol inhaler',pref:'Pediatrics',created:dAgo(3)}
 ];
 const H=[
  {id:uid('H'),pid:'PT1001',date:dAgo(38),dept:'General Medicine',doctor:'Dr. Meera Joshi',complaint:'Fatigue and breathlessness',notes:'ECG advised, BP elevated',referral:'Yes → Cardiology',report:'ECG'},
  {id:uid('H'),pid:'PT1001',date:dAgo(20),dept:'Cardiology',doctor:'Dr. Ramesh Rao',complaint:'Chest tightness on exertion',notes:'Started on antihypertensive, stress test advised',referral:'-',report:'Blood Test'},
  {id:uid('H'),pid:'PT1002',date:dAgo(24),dept:'General Medicine',doctor:'Dr. Arjun Das',complaint:'Headache with arm tingling',notes:'Neuro consult advised',referral:'Yes → Neurology',report:'-'},
  {id:uid('H'),pid:'PT1003',date:dAgo(11),dept:'Orthopedics',doctor:'Dr. Anil Kumar',complaint:'Knee pain after climbing stairs',notes:'Physiotherapy + MRI advised',referral:'-',report:'MRI'},
  {id:uid('H'),pid:'PT1005',date:dAgo(2),dept:'Pediatrics',doctor:'Dr. Kavya Reddy',complaint:'Fever 3 days',notes:'Antipyretics, review in 48h',referral:'-',report:'Blood Test'}
 ];
 const A=[
  {id:uid('AP'),pid:'PT1001',doctor:'Dr. Ramesh Rao',dept:'Cardiology',date:today(),time:'09:00 AM',reason:'Stress test review',priority:'High',status:'Scheduled'},
  {id:uid('AP'),pid:'PT1003',doctor:'Dr. Anil Kumar',dept:'Orthopedics',date:today(),time:'10:30 AM',reason:'MRI report review',priority:'Normal',status:'Scheduled'},
  {id:uid('AP'),pid:'PT1005',doctor:'Dr. Kavya Reddy',dept:'Pediatrics',date:today(),time:'03:00 PM',reason:'Fever follow-up',priority:'Normal',status:'Follow-up'},
  {id:uid('AP'),pid:'PT1002',doctor:'Dr. Vikram Sen',dept:'Neurology',date:dAgo(-2),time:'10:00 AM',reason:'Numbness evaluation',priority:'Normal',status:'Scheduled'},
  {id:uid('AP'),pid:'PT1004',doctor:'Dr. Imran Shaikh',dept:'Dermatology',date:dAgo(4),time:'11:30 AM',reason:'Rash assessment',priority:'Low',status:'Completed'}
 ];
 const R=[
  {id:uid('RF'),pid:'PT1001',fromDoc:'Dr. Meera Joshi',fromDept:'General Medicine',toDoc:'Dr. Ramesh Rao',toDept:'Cardiology',reason:'Exertional chest tightness, abnormal ECG',priority:'High',date:dAgo(30),status:'Accepted'},
  {id:uid('RF'),pid:'PT1002',fromDoc:'Dr. Arjun Das',fromDept:'General Medicine',toDoc:'Dr. Vikram Sen',toDept:'Neurology',reason:'Persistent arm numbness and tingling',priority:'Normal',date:dAgo(22),status:'Pending'},
  {id:uid('RF'),pid:'PT1003',fromDoc:'Dr. Meera Joshi',fromDept:'General Medicine',toDoc:'Dr. Anil Kumar',toDept:'Orthopedics',reason:'Post-ACL knee pain with swelling',priority:'Normal',date:dAgo(12),status:'Completed'},
  {id:uid('RF'),pid:'PT1001',fromDoc:'Dr. Ramesh Rao',fromDept:'Cardiology',toDoc:'Dr. Vikram Sen',toDept:'Neurology',reason:'Rule out neurological cause of dizziness',priority:'Normal',date:dAgo(6),status:'Follow-up Required'},
  {id:uid('RF'),pid:'PT1005',fromDoc:'Dr. Kavya Reddy',fromDept:'Pediatrics',toDoc:'Dr. Leela Menon',toDept:'ENT',reason:'Recurrent throat infection',priority:'Low',date:dAgo(1),status:'Pending'}
 ];
 const RP=[
  {id:uid('RP'),pid:'PT1001',type:'ECG',name:'Resting ECG',date:dAgo(38),doctor:'Dr. Meera Joshi',dept:'General Medicine',summary:'Sinus rhythm with ST changes',findings:'Recommend cardiology review'},
  {id:uid('RP'),pid:'PT1001',type:'Blood Test',name:'Lipid Profile',date:dAgo(20),doctor:'Dr. Ramesh Rao',dept:'Cardiology',summary:'LDL elevated',findings:'Statin considered'},
  {id:uid('RP'),pid:'PT1003',type:'MRI',name:'Right Knee MRI',date:dAgo(10),doctor:'Dr. Anil Kumar',dept:'Orthopedics',summary:'Mild meniscal degeneration',findings:'Conservative management'},
  {id:uid('RP'),pid:'PT1005',type:'Blood Test',name:'CBC',date:dAgo(2),doctor:'Dr. Kavya Reddy',dept:'Pediatrics',summary:'Mild leukocytosis',findings:'Likely viral, review advised'}
 ];
 return {patients:P,history:H,appointments:A,referrals:R,reports:RP,assessments:[],notifs:[
   {t:'Referral pending acceptance — PT1002 → Neurology',d:dAgo(1)},
   {t:'High-risk patient flagged: PT1001',d:today()},
   {t:'New report uploaded for PT1005',d:today()}
 ]};
}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const pt=pid=>DB.patients.find(p=>p.pid===pid);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- risk engine (transparent prototype) ---------- */
function risk(pid){
  const p=pt(pid); if(!p) return {score:0,level:'LOW',lines:[]};
  let s=0,L=[];
  const adm=parseInt(p.admissions)||0;
  if(adm>0){const v=Math.min(adm*10,25);s+=v;L.push(['Previous admissions ('+adm+')','+'+v])}
  const visits=DB.history.filter(h=>h.pid===pid).length;
  if(visits>=2){const v=Math.min(visits*5,20);s+=v;L.push(['Repeated hospital visits ('+visits+')','+'+v])}
  const refs=DB.referrals.filter(r=>r.pid===pid);
  if(refs.length>1){const v=Math.min(refs.length*6,18);s+=v;L.push(['Multiple referrals ('+refs.length+')','+'+v])}
  if(refs.some(r=>r.status==='Follow-up Required'||r.status==='Pending')){s+=10;L.push(['Pending follow-up / referral','+10'])}
  if(p.age>=60){s+=12;L.push(['Age 60+','+12'])} else if(p.age>=45){s+=6;L.push(['Age 45+','+6'])}
  const cond=(p.conditions||'').toLowerCase();
  ['diabet','hypertens','asthma','cardiac','kidney'].forEach(k=>{if(cond.includes(k)){s+=7;L.push(['Chronic condition: '+k,'+7'])}});
  const ass=DB.assessments.filter(a=>a.pid===pid);
  if(ass.some(a=>a.urgency==='URGENT')){s+=25;L.push(['AI assessment flagged red-flag symptoms','+25'])}
  else if(ass.some(a=>a.urgency==='CAUTION')){s+=10;L.push(['AI assessment advised evaluation','+10'])}
  const sev=ass.length?Math.max(...ass.map(a=>a.severity||0)):0;
  if(sev>=7){s+=8;L.push(['Reported severity '+sev+'/10','+8'])}
  s=Math.min(100,s);
  const level=s>=75?'CRITICAL':s>=50?'HIGH':s>=25?'MEDIUM':'LOW';
  return {score:s,level,lines:L};
}
const riskTag=l=>`<span class="tag t-${l==='CRITICAL'?'crit':l==='HIGH'?'high':l==='MEDIUM'?'med':'low'}">${l==='CRITICAL'?'🔴':l==='HIGH'?'🩷':l==='MEDIUM'?'🟠':'🟢'} ${l}</span>`;

function go(hash){
  const id=(hash||'#dashboard').replace('#','').split('/')[0];
  const arg=(hash||'').split('/')[1];
  location.hash=hash;
  if(window.stopVoice)stopVoice(); if(window.endCall&&id!=='videocall') endCall(true);
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('on'));
  const n=$('nav-'+id); if(n)n.classList.add('on');
  $('side').classList.remove('open');
  (VIEWS[id]||VIEWS.dashboard)(arg);
  window.scrollTo(0,0);
}

  const p={pid:g('pid'),name:g('name'),age:+g('age'),gender:g('gender'),phone:g('phone'),email:g('email'),address:g('address'),
   blood:g('blood'),ec:g('ec'),allergies:g('allergies'),conditions:g('conditions'),symptoms:g('symptoms'),
   admissions:g('admissions'),surgeries:g('surgeries'),meds:g('meds'),pref:g('pref'),created:today()};

function dynQuestions(){
  const q=[];
  const l=AI.loc,c=AI.cat,a=AI.assoc;
  if(l==='Knee') q.push(['knee','Knee specific',['Locking or giving way','Swelling around knee','Pain climbing stairs','Recent twist/injury','Difficulty fully bending']]);
  if(l==='Calf') q.push(['calf','Calf specific',['Calf swelling','Redness or warmth','Recent long travel / immobility','Sudden onset','Pain when flexing foot']]);
  if(c==='Numbness / tingling / weakness'||AI.type.includes('Numbness')||a.includes('Numbness'))
    q.push(['neuro','Nerve related',['Muscle weakness','Back or neck pain','Loss of sensation','Difficulty gripping objects','Balance problems']]);
  if(c==='Chest discomfort') q.push(['card','Heart related',['Pain spreads to arm/jaw','Sweating with pain','Worse on exertion','Palpitations','Breathlessness lying down']]);
  if(c==='Skin problem') q.push(['skin','Skin related',['Itching','Spreading rash','Blisters','Recent new product/medicine','Pain in the area']]);
  if(c==='Fever / general illness') q.push(['gen','General',['Fever above 102°F','Loss of appetite','Weight loss','Night sweats','Recent travel']]);
  if(c==='Ear / nose / throat') q.push(['ent','ENT related',['Hearing reduced','Discharge','Sore throat','Blocked nose','Voice change']]);
  return q;
}
function renderAI(){
  const steps=['Patient','Main concern','Location','Pain type','Duration','Severity','Pattern','Associated','Focused questions','Result'];
  const pctRaw=Math.min(AI.step/9*100,100);
  const dq=dynQuestions();
  let body='';
  const S=AI.step;
  if(S===0){
    body=`<div class="field"><label>Select patient (optional — guidance can run anonymously)</label>
      <select id="aiP"><option value="">Anonymous walk-in</option>${DB.patients.map(p=>`<option value="${p.pid}" ${p.pid===AI.pid?'selected':''}>${esc(p.name)} (${p.pid})</option>`).join('')}</select></div>
      <button class="btn" onclick="AI.pid=$('aiP').value;AI.step=1;renderAI()">Start assessment →</button>`;
  } else if(S===1){
    body=`<p>What is the main concern today?</p><div class="chips">${Object.keys(CATS).map(c=>`<div class="chip ${AI.cat===c?'on':''}" onclick="AI.cat='${c}';AI.step=2;renderAI()">${c}</div>`).join('')}</div>`;
  } else if(S===2){
    body=`<p>Where exactly is the problem?</p><div class="chips">${CATS[AI.cat].loc.map(l=>`<div class="chip ${AI.loc===l?'on':''}" onclick="AI.loc='${l}';AI.step=3;renderAI()">${l}</div>`).join('')}</div>`;
  } else if(S===3){
    body=`<p>What type of sensation best describes it? (multiple allowed)</p><div class="chips">${PAINTYPES.map(t=>`<div class="chip ${AI.type.includes(t)?'on':''}" onclick="tog(AI.type,'${t}')">${t}</div>`).join('')}</div>${nextBtn()}`;
  } else if(S===4){
    body=`<p>When did it start?</p><div class="chips">${DURS.map(d=>`<div class="chip ${AI.dur===d?'on':''}" onclick="AI.dur='${d}';AI.step=5;renderAI()">${d}</div>`).join('')}</div>`;
  } else if(S===5){
    body=`<p>How severe is it right now? <b id="sevV">${AI.sev}</b>/10</p>
      <input type="range" min="0" max="10" value="${AI.sev}" oninput="AI.sev=+this.value;$('sevV').textContent=this.value" />${nextBtn()}`;
  } else if(S===6){
    body=`<p>When does it occur?</p><div class="chips">${PATTERN.map(t=>`<div class="chip ${AI.pattern.includes(t)?'on':''}" onclick="tog(AI.pattern,'${t}')">${t}</div>`).join('')}</div>${nextBtn()}`;
  } else if(S===7){
    body=`<p>Any additional symptoms?</p><div class="chips">${ASSOC.map(t=>`<div class="chip ${AI.assoc.includes(t)?'on':''}" onclick="tog(AI.assoc,'${t}')">${t}</div>`).join('')}</div>${nextBtn()}`;
  } else if(S===8){
    body=dq.length?dq.map(q=>`<p><b>${q[1]}</b> — questions adapted to your selections</p>
      <div class="chips">${q[2].map(o=>`<div class="chip ${(AI.dyn[q[0]]||[]).includes(o)?'on':''}" onclick="togDyn('${q[0]}','${o.replace(/'/g,"\\'")}')">${o}</div>`).join('')}</div>`).join('')
      :'<p class="mini">No focused follow-ups required for this pattern.</p>';
    body+=`<button class="btn" style="margin-top:14px" onclick="AI.step=9;renderAI()">Generate guidance →</button>`;
  } else { renderAIResult(); return }
  $('view').innerHTML=`<h1 class="page">AI Symptom Assistant</h1>
   <p class="sub">Structured, question-driven triage guidance — it never names a disease.</p>
   <div class="alert a-org">${DISCLAIM}</div>
   <div class="card"><div class="h">Step ${S+1} of 10 — ${steps[S]}</div>
     <div class="bar"><i style="width:${pctRaw}%"></i></div>
     <div style="margin-top:16px">${body}</div>
     ${S>0?`<button class="btn o s" style="margin-top:16px" onclick="AI.step=Math.max(0,AI.step-1);renderAI()">← Back</button>`:''}
   </div>`;
}
const nextBtn=()=>`<button class="btn" style="margin-top:14px" onclick="AI.step++;renderAI()">Continue →</button>`;
function tog(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);renderAI()}
function togDyn(k,v){AI.dyn[k]=AI.dyn[k]||[];tog(AI.dyn[k],v)}

function evaluate(){
  const flags=AI.assoc.filter(a=>REDFLAGS.includes(a));
  const dynAll=Object.values(AI.dyn).flat();
  if(dynAll.includes('Pain spreads to arm/jaw')||dynAll.includes('Sweating with pain')) flags.push('Cardiac pattern reported');
  if(AI.sev>=9) flags.push('Very high reported severity');
  if(AI.cat==='Numbness / tingling / weakness'&&dynAll.includes('Muscle weakness')) flags.push('Weakness with numbness');
  const urgency=flags.length?'URGENT':(AI.sev>=7||AI.dur==='More than a month'||AI.assoc.length>=3)?'CAUTION':'ROUTINE';

  // department scoring
  const sc={};const add=(d,n,why)=>{sc[d]=sc[d]||{n:0,why:[]};sc[d].n+=n;if(why)sc[d].why.push(why)};
  add(CATS[AI.cat].dept,4,'Main concern category "'+AI.cat+'" maps to this specialty');
  if(['Sharp','Dull','Throbbing','Stiffness','Cramping'].some(t=>AI.type.includes(t))&&['Leg / limb pain','Back pain'].includes(AI.cat))
    add('Orthopedics',3,'Musculoskeletal pain pattern (joint/bone/muscle)');
  if(AI.type.includes('Numbness')||AI.type.includes('Tingling')||AI.assoc.includes('Weakness'))
    add('Neurology',3,'Nerve-related features: numbness / tingling / weakness');
  if(AI.assoc.includes('Chest discomfort')||AI.assoc.includes('Shortness of breath'))
    add('Cardiology',4,'Chest discomfort or breathlessness reported');
  if(AI.assoc.includes('Redness')||AI.assoc.includes('Rash / itching')) add('Dermatology',2,'Skin changes reported');
  if(AI.assoc.includes('Fever')) add('General Medicine',2,'Fever suggests a general medical evaluation first');
  if(dynAll.includes('Calf swelling')||dynAll.includes('Recent long travel / immobility'))
    add('General Medicine',3,'Circulation-related features need prompt general assessment');
  const rec=Object.entries(sc).sort((a,b)=>b[1].n-a[1].n)[0];

  const groups=[];
  if(['Orthopedics'].includes(rec[0])||AI.cat.includes('pain')) groups.push('Musculoskeletal-related symptoms');
  if(AI.type.includes('Numbness')||AI.type.includes('Tingling')||AI.assoc.includes('Weakness')) groups.push('Nerve-related symptoms');
  if(dynAll.includes('Calf swelling')||AI.assoc.includes('Swelling')||AI.assoc.includes('Shortness of breath')) groups.push('Circulation-related symptoms');
  if(AI.assoc.includes('Recent injury')) groups.push('Injury-related symptoms');
  if(AI.assoc.includes('Fever')) groups.push('Infection / inflammation-related symptoms');
  if(!groups.length) groups.push('General, non-specific symptoms');

  return {urgency,flags:[...new Set(flags)],dept:rec[0],why:rec[1].why,groups:[...new Set(groups)],dynAll};
}
function renderAIResult(){
  const e=evaluate();
  const p=AI.pid?pt(AI.pid):null;
  const rec={id:uid('AS'),pid:AI.pid,date:today(),cat:AI.cat,loc:AI.loc,type:AI.type,dur:AI.dur,severity:AI.sev,
    pattern:AI.pattern,assoc:AI.assoc,dyn:AI.dyn,urgency:e.urgency,dept:e.dept,why:e.why,groups:e.groups,flags:e.flags};
  window.__lastAssess=rec;
  const alert=e.urgency==='URGENT'
   ? `<div class="alert a-red"><h2 style="margin:0 0 6px">🔴 URGENT MEDICAL ATTENTION</h2>
      <p>These symptoms may require urgent medical evaluation. Please seek immediate professional medical care or contact local emergency services.</p>
      <p class="mini">Triggered by: ${e.flags.map(esc).join(', ')}</p></div>`
   : e.urgency==='CAUTION'
   ? `<div class="alert a-org"><h3 style="margin:0 0 6px">🟠 Medical evaluation recommended</h3><p class="mini">Symptom severity or duration suggests a professional assessment soon.</p></div>`
   : `<div class="alert a-grn"><h3 style="margin:0 0 6px">🟢 Routine consultation may be appropriate</h3><p class="mini">No urgent warning signs were selected.</p></div>`;

  const docs=DOCTORS.filter(d=>d.dept===e.dept);
  $('view').innerHTML=`<h1 class="page">Assessment Result</h1><p class="sub">Structured guidance summary — generated ${today()}</p>
  ${alert}
  <div class="grid g2">
   <div class="card"><div class="h">Symptom Summary</div>
    ${[['Main complaint',AI.cat],['Location',AI.loc],['Sensation type',AI.type.join(', ')||'—'],['Duration',AI.dur],
       ['Severity',AI.sev+'/10'],['Pattern',AI.pattern.join(', ')||'—'],['Associated symptoms',AI.assoc.join(', ')||'None'],
       ['Focused findings',e.dynAll.join(', ')||'—']]
      .map(k=>`<div class="kv"><span>${k[0]}</span><b style="text-align:right">${esc(k[1])}</b></div>`).join('')}</div>
   <div class="card"><div class="h">Possible Symptom Categories</div>
     ${e.groups.map(g=>`<div class="kv"><span>•</span><b>${g}</b></div>`).join('')}
     <div class="alert a-org" style="margin-top:12px"><p style="margin:0">These symptoms can have several possible causes. A healthcare professional should evaluate the patient. No diagnosis is being made.</p></div>
   </div></div>

  <div class="card" style="margin-top:14px"><div class="h">Suggested Department — ${deptIcon(e.dept)} ${e.dept}</div>
    <p class="mini">Why this department was suggested:</p>
    ${e.why.map(w=>`<div class="kv"><span>↳</span><b>${esc(w)}</b></div>`).join('')}
    <div class="h" style="margin-top:16px">Available Doctors</div>
    <div class="grid g3">${docs.map(d=>`<div class="card"><b>${d.name}</b><div class="mini">${d.dept} · ${d.exp} years experience</div>
      <div class="mini">Available: ${d.slots.join(', ')}</div>
      <button class="btn s" style="margin-top:8px" onclick="apptForm('${AI.pid}','${d.id}')">Select &amp; Book</button></div>`).join('')}</div>
  </div>

  <div class="card" style="margin-top:14px"><div class="h">Doctor Consultation Summary
    <span><button class="btn s b" onclick="sendToDoctor()">📨 Send to Doctor</button>
    <button class="btn s" onclick="addAssessToHistory()">➕ Add to Patient History</button></span></div>
    ${consultSummary(rec)}
  </div>
  <div style="margin-top:14px"><button class="btn o" onclick="VIEWS.ai('${AI.pid}')">🔄 New assessment</button></div>`;
}
function consultSummary(a){
  const p=a.pid?pt(a.pid):null;
  const refs=p?DB.referrals.filter(r=>r.pid===p.pid):[];
  const hist=p?DB.history.filter(h=>h.pid===p.pid):[];
  const reps=p?DB.reports.filter(r=>r.pid===p.pid):[];
  const rows=[
   ['Patient ID',p?p.pid:'Anonymous'],['Patient Name',p?p.name:'—'],['Age',p?p.age:'—'],
   ['Main complaint',a.cat],['Symptom location',a.loc],['Pain / sensation type',(a.type||[]).join(', ')||'—'],
   ['Duration',a.dur],['Severity',a.severity+'/10'],['Associated symptoms',(a.assoc||[]).join(', ')||'None'],
   ['Relevant previous conditions',p?(p.conditions||'None'):'—'],['Current medication',p?(p.meds||'None'):'—'],
   ['Allergies',p?(p.allergies||'None'):'—'],
   ['Previous department visits',hist.length?[...new Set(hist.map(h=>h.dept))].join(', '):'None'],
   ['Previous referrals',refs.length?refs.map(r=>r.fromDept+'→'+r.toDept).join(', '):'None'],
   ['Previous reports',reps.length?reps.map(r=>r.type).join(', '):'None'],
   ['AI suggested department',a.dept],['Urgency level',a.urgency],
   ['AI reasoning summary',(a.why||[]).join(' | ')]
  ];
  return rows.map(r=>`<div class="kv"><span>${r[0]}</span><b style="text-align:right;max-width:60%">${esc(r[1])}</b></div>`).join('')
   +'<p class="mini" style="margin-top:10px">The patient does not need to repeat this information — the doctor opens this summary before consultation.</p>';
}
function sendToDoctor(){
  const a=window.__lastAssess; if(!a)return;
  if(!DB.assessments.some(x=>x.id===a.id))DB.assessments.push(a);
  DB.notifs.unshift({t:'New AI assessment sent to '+a.dept+(a.pid?' for '+a.pid:''),d:today()});
  save();toast('Summary sent to '+a.dept+' queue');
}
function addAssessToHistory(){
  const a=window.__lastAssess; if(!a)return;
  if(!a.pid){toast('Select a registered patient first');return}
  if(!DB.assessments.some(x=>x.id===a.id))DB.assessments.push(a);
  DB.history.push({id:uid('H'),pid:a.pid,date:today(),dept:a.dept,doctor:'AI Triage Desk',
    complaint:a.cat+' ('+a.loc+')',notes:'Severity '+a.severity+'/10, urgency '+a.urgency,referral:'-',report:'-'});
  save();toast('Added to patient history');
}

/* ---------- ADSA referral graph ---------- */
VIEWS.graph=pid=>{
  const nodes=DEPTS.map((d,i)=>{const ang=(i/DEPTS.length)*Math.PI*2-Math.PI/2;
    return {id:d.name,icon:d.icon,x:480+300*Math.cos(ang),y:300+220*Math.sin(ang)}});
  const edges={};
  DB.referrals.filter(r=>!pid||r.pid===pid).forEach(r=>{const k=r.fromDept+'|'+r.toDept;edges[k]=(edges[k]||0)+1});
  const N=n=>nodes.find(x=>x.id===n);
  const svgEdges=Object.entries(edges).map(([k,w])=>{const [a,b]=k.split('|');const A=N(a),B=N(b);if(!A||!B)return'';
    const mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
    return `<path d="M${A.x} ${A.y} Q ${mx+30} ${my-30} ${B.x} ${B.y}" stroke="url(#g1)" stroke-width="${1+w*1.6}" fill="none" marker-end="url(#ar)" opacity=".85"/>
      <text x="${mx}" y="${my-8}" fill="#93a4c4" font-size="11" text-anchor="middle">${w} referral${w>1?'s':''}</text>`}).join('');
  const svgNodes=nodes.map(n=>{const deg=Object.keys(edges).filter(k=>k.startsWith(n.id+'|')||k.endsWith('|'+n.id)).length;
    return `<g class="gn" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${34+deg*3}" fill="#152238" stroke="${deg?'#19c3a3':'#243553'}" stroke-width="2"/>
     <text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="20">${n.icon}</text>
     <text x="${n.x}" y="${n.y+54}" text-anchor="middle" fill="#e8eefc" font-size="11">${n.id}</text>
     <text x="${n.x}" y="${n.y+68}" text-anchor="middle" fill="#93a4c4" font-size="10">degree ${deg}</text></g>`}).join('');
  const chain=pid?DB.referrals.filter(r=>r.pid===pid).sort((a,b)=>a.date.localeCompare(b.date)):[];
  $('view').innerHTML=`<h1 class="page">ADSA Referral Graph</h1>
  <p class="sub">Nodes = departments / doctors · Edges = referral relationships · Edge weight = number of referrals.</p>
  <div class="card"><div class="h">Network View
    <select style="max-width:280px" onchange="VIEWS.graph(this.value)"><option value="">All patients (hospital network)</option>
      ${DB.patients.map(p=>`<option value="${p.pid}" ${p.pid===pid?'selected':''}>${esc(p.name)} (${p.pid})</option>`).join('')}</select></div>
   <div style="overflow:auto"><svg viewBox="0 0 960 620" width="100%" height="560">
    <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#19c3a3"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f7bff"/></marker></defs>
    ${svgEdges}${svgNodes}</svg></div></div>
  ${pid?`<div class="card" style="margin-top:14px"><div class="h">Patient Referral Path — ${esc((pt(pid)||{}).name||'')}</div>
    <div class="tl"><div class="it"><div class="d">Start</div><b>Patient ${pid}</b></div>
    ${chain.map(r=>`<div class="it"><div class="d">${r.date} · ${r.status}</div><b>${r.fromDoc} · ${r.fromDept} → ${r.toDoc} · ${r.toDept}</b><div class="mini">${esc(r.reason)}</div></div>`).join('')}</div></div>`:''}
  <div class="card" style="margin-top:14px"><div class="h">How ADSA concepts are applied</div>
   <div class="kv"><span>Graph G = (V, E)</span><b>V = departments/doctors, E = referral relationships</b></div>
   <div class="kv"><span>Directed edges</span><b>Referral direction from source to target department</b></div>
   <div class="kv"><span>Weighted edges</span><b>Number of referrals between two departments</b></div>
   <div class="kv"><span>Degree of a node</span><b>How connected a department is in the referral network</b></div>
   <div class="kv"><span>Path traversal</span><b>A patient's journey is a path through the graph (BFS/DFS style traversal)</b></div>
   <div class="kv"><span>Adjacency list</span><b>Each department stores its outgoing referral targets</b></div></div>`;
};

const barChart=(data,color)=>{const max=Math.max(1,...data.map(d=>d[1]));
 return data.map(d=>`<div style="margin-bottom:9px"><div class="kv" style="border:0;padding:2px 0"><span>${esc(d[0])}</span><b>${d[1]}</b></div>

VIEWS.analytics=()=>{
  const byDept=DEPTS.map(d=>[d.name,DB.patients.filter(p=>p.pref===d.name).length]);
  const appDept=DEPTS.map(d=>[d.name,DB.appointments.filter(a=>a.dept===d.name).length]);
  const refCount=DEPTS.map(d=>[d.name,DB.referrals.filter(r=>r.toDept===d.name).length]);
  const riskDist=['LOW','MEDIUM','HIGH','CRITICAL'].map(l=>[l,DB.patients.filter(p=>risk(p.pid).level===l).length]);
  const freq=DB.patients.map(p=>[p.name,DB.history.filter(h=>h.pid===p.pid).length]).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const pend=DB.referrals.filter(r=>r.status==='Pending').length,comp=DB.referrals.filter(r=>r.status==='Completed').length;
  // donut
  const total=Math.max(1,DB.referrals.length);const segs=[['Pending',pend,'#ff9f43'],['Completed',comp,'#28d07f'],
   ['Accepted',DB.referrals.filter(r=>r.status==='Accepted').length,'#2f7bff'],['Follow-up',DB.referrals.filter(r=>r.status==='Follow-up Required').length,'#ff5468']];
  let off=0;const circ=2*Math.PI*60;
  const donut=segs.map(s=>{const len=s[1]/total*circ;const el=`<circle r="60" cx="90" cy="90" fill="none" stroke="${s[2]}" stroke-width="22"
    stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;off+=len;return el}).join('');
  $('view').innerHTML=`<h1 class="page">Analytics</h1><p class="sub">Operational insight generated from centralized records.</p>
  <div class="grid g2">
   <div class="card"><div class="h">Patients by Department</div>${barChart(byDept)}</div>
   <div class="card"><div class="h">Appointments by Department</div>${barChart(appDept,'linear-gradient(90deg,#2f7bff,#7fb0ff)')}</div>
   <div class="card"><div class="h">Referrals Received by Department</div>${barChart(refCount,'linear-gradient(90deg,#ff9f43,#ffd08a)')}</div>
   <div class="card"><div class="h">Risk Distribution</div>${barChart(riskDist,'linear-gradient(90deg,#ff5468,#ffb4cd)')}</div>
   <div class="card"><div class="h">Frequent Visitors (visit count)</div>${barChart(freq,'linear-gradient(90deg,#c08bff,#8f6bff)')}</div>
   <div class="card"><div class="h">Referral Status Mix</div>
     <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      <svg width="180" height="180">${donut}<text x="90" y="96" text-anchor="middle" fill="#e8eefc" font-size="22" font-weight="700">${DB.referrals.length}</text></svg>
      <div>${segs.map(s=>`<div class="kv"><span><b style="color:${s[2]}">■</b> ${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>
     </div></div>
  </div>`;
};

   <div class="card"><div class="h">The Problem</div>
    <p>Departments such as General Medicine, Cardiology, Neurology, Orthopedics, Pediatrics, Dermatology, ENT and Gynecology often maintain patient information separately. Staff then struggle to quickly identify previous treatments, appointments, doctors, departments, referral history, reports and repeated visits.</p></div>
   <div class="card"><div class="h">The Solution</div>
    <p>A centralized Hospital Records &amp; Referral System connecting:</p>
    <p class="mini">Patient → Symptoms → AI Symptom Guidance → Doctor → Department → Appointment → Referral → Medical History → Reports → Risk Score → Staff Dashboard</p>
    <p>One patient identity, one timeline, visible to every department.</p></div>
   <div class="card"><div class="h">Safety Statement</div>
    <div class="alert a-org"><p style="margin:0">This is an academic prototype. The AI assistant provides preliminary guidance only and does not diagnose disease or replace professional medical care. Risk scores are illustrative and not clinically validated. In an emergency, contact local emergency services.</p></div></div>
   <div class="card"><div class="h">Technical Notes</div>
    <div class="kv"><span>Architecture</span><b>Single HTML file — HTML + CSS + JS</b></div>
    <div class="kv"><span>Persistence</span><b>Browser localStorage (key: medilink_v1)</b></div>
    <div class="kv"><span>Dependencies</span><b>None — runs offline / Live Server</b></div>
    <div class="kv"><span>Visuals</span><b>Inline SVG charts, graph and ER diagram</b></div>
    <button class="btn r s" style="margin-top:12px" onclick="reset()">♻️ Reset demo data</button></div>
  </div>`;
};

/* ---------- global search & notifications ---------- */
function globalSearch(q){
  q=q.trim().toLowerCase(); if(q.length<2){if(location.hash.includes('search'))go('#patients');return}
  const res=DB.patients.filter(p=>[p.pid,p.name,p.phone,p.pref].join(' ').toLowerCase().includes(q))
    .concat(DB.patients.filter(p=>DB.appointments.some(a=>a.pid===p.pid&&(a.doctor+a.dept).toLowerCase().includes(q))
      ||DB.referrals.some(r=>r.pid===p.pid&&(r.toDoc+r.toDept+r.fromDoc+r.fromDept).toLowerCase().includes(q))));
  const uniq=[...new Map(res.map(p=>[p.pid,p])).values()];
  skipHash=true;location.hash='#search';
  $('view').innerHTML=`<h1 class="page">Search results for “${esc(q)}”</h1>
   <p class="sub">${uniq.length} matching patient record(s) — centralized lookup replaces searching separate department files.</p>
   ${uniq.map(p=>{const r=risk(p.pid);return `<div class="card" style="margin-bottom:12px"><div class="h">${esc(p.name)} · ${p.pid} ${riskTag(r.level)}
    <button class="btn s" onclick="go('#patient/${p.pid}')">Open full record</button></div>
    <div class="grid g3">
     <div><div class="mini">Profile</div>${p.age} yrs · ${p.gender} · ${p.blood}<div class="mini">${esc(p.phone)} · ${esc(p.email)}</div></div>
     <div><div class="mini">Previous visits</div>${DB.history.filter(h=>h.pid===p.pid).length} · ${[...new Set(DB.history.filter(h=>h.pid===p.pid).map(h=>h.dept))].join(', ')||'—'}</div>
     <div><div class="mini">Reports</div>${DB.reports.filter(x=>x.pid===p.pid).map(x=>x.type).join(', ')||'—'}</div>
     <div><div class="mini">Referrals</div>${DB.referrals.filter(x=>x.pid===p.pid).map(x=>x.fromDept+'→'+x.toDept).join(', ')||'—'}</div>
     <div><div class="mini">Appointments</div>${DB.appointments.filter(x=>x.pid===p.pid).map(x=>x.date+' '+x.dept).join(', ')||'—'}</div>
     <div><div class="mini">AI assessments</div>${DB.assessments.filter(x=>x.pid===p.pid).length}</div>
    </div></div>`}).join('')||'<div class="card">No matching records.</div>'}`;
}
VIEWS.search=()=>globalSearch($('gsearch').value);
function showNotifs(){openModal(`<h3 style="margin-top:0">🔔 Notifications</h3>
 ${DB.notifs.map(n=>`<div class="kv"><span>${n.d}</span><b style="text-align:right">${esc(n.t)}</b></div>`).join('')}
 <button class="btn o" style="margin-top:12px" onclick="closeModal()">Close</button>`)}

/* ---------- boot ---------- */
function boot(){
  buildNav();
  $('today').innerHTML=new Date().toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const urgent=DB.assessments.filter(a=>a.urgency==='URGENT').length
    + DB.patients.filter(p=>risk(p.pid).level==='CRITICAL').length
    + DB.referrals.filter(r=>r.priority==='High'&&r.status==='Pending').length;
  $('emgCount').textContent=urgent;
  setTimeout(()=>go(location.hash||'#dashboard'),0);
}
const _go=go;
window.go=h=>{const [id,arg]=h.replace('#','').split('/');location.hash=h;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.remove('on'));
  const n=$('nav-'+id); if(n)n.classList.add('on');
  $('side').classList.remove('open');
  (VIEWS[id]||VIEWS.dashboard)(arg);window.scrollTo(0,0)};
boot();
</script>

<script>
/* ---------- Language: whole-site Telugu / English ---------- */
function setCookie(v){const d=location.hostname;document.cookie='googtrans='+v+';path=/';if(d)document.cookie='googtrans='+v+';path=/;domain='+d;}
function curLang(){return localStorage.getItem('medilink_lang')||'en'}
function markLang(l){['en','te'].forEach(x=>{const b=document.getElementById('lang-'+x);if(b)b.classList.toggle('on',x===l)});document.documentElement.lang=l}
function setLang(l){
  stopVoice();localStorage.setItem('medilink_lang',l);markLang(l);
  const sel=document.querySelector('.goog-te-combo');
  if(l==='en'){setCookie('/en/en');if(sel){sel.value='en';sel.dispatchEvent(new Event('change'))}setTimeout(()=>location.reload(),150);return}
  setCookie('/en/te');
  if(sel){sel.value='te';sel.dispatchEvent(new Event('change'))}else location.reload();
  toast('తెలుగు భాష ఎంచుకోబడింది');
}
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'en,te',autoDisplay:false},'google_translate_element')}
markLang(curLang()); if(curLang()==='te') setCookie('/en/te');

/* ---------- Voice: read aloud with a working Stop ---------- */
let speaking=false;
function stopVoice(){
  speaking=false;
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const vb=document.getElementById('voicebar');if(vb)vb.classList.remove('on');
}
function speak(text){
  if(!('speechSynthesis' in window)){toast('Voice not supported in this browser');return}
  stopVoice();
  const lang=curLang()==='te'?'te-IN':'en-IN';
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang.startsWith(lang.slice(0,2)));
  if(lang==='te-IN'&&!v)toast('Telugu voice not installed on this device — using default voice');
  const parts=text.replace(/\s+/g,' ').match(/[^.!?।\n]{1,220}[.!?।]?/g)||[];
  speaking=true;document.getElementById('voicebar').classList.add('on');
  document.getElementById('vtxt').textContent=lang==='te-IN'?'చదువుతోంది…':'Speaking…';
  parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t.trim());u.lang=lang;if(v)u.voice=v;u.rate=.95;
    if(i===parts.length-1)u.onend=()=>{if(speaking)stopVoice()};speechSynthesis.speak(u)});
}
function readPage(){const el=document.getElementById('view');speak(el?el.innerText.slice(0,4000):'')}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopVoice()});
window.addEventListener('beforeunload',stopVoice);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});

/* ---------- Video call with doctor ---------- */
let camStream=null;
function endCall(silent){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
  const j=document.getElementById('jitsiBox');if(j)j.innerHTML='';
  if(!silent)toast('Call ended / కాల్ ముగిసింది');
}
VIEWS.videocall=function(){
  const docs=DOCTORS.map(d=>`<option value="${d.id}">${d.name} — ${d.dept}</option>`).join('');
  $('view').innerHTML=`<h1 class="page">📹 Video Call a Doctor</h1>
  <p class="sub">Talk to a doctor face to face from home. Press the big green button to start.</p>
  <div class="card" style="margin-bottom:14px">
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <label style="flex:1;min-width:220px">Choose doctor<br><select id="vcDoc" style="width:100%">${docs}</select></label>
      <label style="flex:1;min-width:180px">Your name<br><input id="vcName" placeholder="Patient name" style="width:100%"></label>
      <button class="btn" style="background:var(--ok);color:#04241d;font-size:16px;padding:12px 20px" onclick="startCall()">📞 Start Video Call</button>
      <button class="btn" onclick="testCam()">🎥 Test my camera</button>
    </div>
    <p class="mini" style="margin-top:10px">Share the room link with the doctor — both people join the same room. Allow camera and microphone when the browser asks.</p>
  </div>
  <div id="camTest"></div>
  <div id="jitsiBox"></div>`;
};
async function testCam(){
  endCall(true);
  const box=$('camTest');
  box.innerHTML=`<div class="vgrid"><div class="vbox"><video id="myVid" autoplay muted playsinline></video><span class="lbl">You</span></div>
   <div class="vbox"><div>👨‍⚕️<br>Doctor will appear here</div><span class="lbl">Doctor</span></div></div>
   <div class="vctl"><button id="bMic" onclick="togTrack('audio',this)" title="Mute">🎤</button><button id="bCam" onclick="togTrack('video',this)" title="Camera">📷</button><button class="end" onclick="endCall();$('camTest').innerHTML=''" title="End">📞</button></div>`;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('myVid').srcObject=camStream}
  catch(e){box.innerHTML='<div class="alert a-org">Camera or microphone permission was blocked. Please allow it in your browser and try again.</div>'}
}
function togTrack(kind,btn){if(!camStream)return;camStream.getTracks().filter(t=>t.kind===kind).forEach(t=>{t.enabled=!t.enabled;btn.classList.toggle('off',!t.enabled)})}
function startCall(){
  endCall(true);$('camTest').innerHTML='';
  const d=DOCTORS.find(x=>x.id===$('vcDoc').value);const nm=encodeURIComponent($('vcName').value||'Patient');
  const room='MediLink-'+d.id+'-'+new Date().toISOString().slice(0,10).replace(/-/g,'');
  const url='https://meet.jit.si/'+room;
  $('jitsiBox').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
   <b>In call with ${d.name}</b><span class="mini">Room link: <a href="${url}" target="_blank">${url}</a></span>
   <button class="btn" style="background:var(--dang);color:#fff" onclick="endCall()">📞 End Call</button></div>
   <iframe class="jitsi" allow="camera; microphone; fullscreen; display-capture; autoplay" src="${url}#userInfo.displayName=%22${nm}%22&config.prejoinPageEnabled=false"></iframe></div>`;
  toast('Joining video call…');
}
</script>
<script>if((location.hash||'').startsWith('#videocall'))go('#videocall');</script>
